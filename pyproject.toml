[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yatslist"
version = "0.1.0"
description = "Yat's List 命令行客户端：深圳活动 / 黑客松 / 深圳外国人活动 — Shenzhen events, served to your terminal."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Yat Tse" },
]
keywords = ["shenzhen", "events", "hackathon", "cli", "yatslist"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://yatslist.com"
"Events JSON" = "https://yatslist.com/events.json"
"Hackathons JSON" = "https://yatslist.com/hackathons.json"

[project.scripts]
yatslist = "yatslist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
